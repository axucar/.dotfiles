# give color to terminal within tmux session (otherwise just white font)
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB'

# forward extended keys (CSI u) so apps like Claude Code see Shift+Enter,
# Ctrl+Enter, etc. instead of plain Enter. `extkeys` tells tmux the outer
# terminal (Ghostty) understands the CSI u encoding.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'

## switch panes using Ctrl+hjkl
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

## split panes
bind | split-window -h
bind - split-window -v

## reload config file
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"

## enable mouse mode (tmux 2.1 and above)
set -g mouse on

## don't rename windows automatically
#set-option -g allow-rename off

## start window numbering at 1
set -g base-index 1


## appearance
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1
set-window-option -g window-status-current-style bg=colour214,fg=colour237 # fg=bg1

## window status display
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '




